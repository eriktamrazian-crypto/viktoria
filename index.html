<!doctype html>
<html lang="hy">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f7f2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Վիկտորյա">
<title>Վիկտորյա</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preload" href="fonts/Mardoto-Regular.ttf" as="font" type="font/ttf" crossorigin>
<link rel="preload" href="fonts/Mardoto-Bold.ttf" as="font" type="font/ttf" crossorigin>
<style>
@font-face{font-family:"Mardoto";src:url(fonts/Mardoto-Regular.ttf) format("truetype");font-weight:400;font-display:swap}
@font-face{font-family:"Mardoto";src:url(fonts/Mardoto-Medium.ttf) format("truetype");font-weight:500 600;font-display:swap}
@font-face{font-family:"Mardoto";src:url(fonts/Mardoto-Bold.ttf) format("truetype");font-weight:700;font-display:swap}
:root{
  --paper:#f7f7f2; --card:#ffffff; --ink:#2a2430; --ink-2:#5f5a66; --ink-3:#958f99; --line:#e7e6de; --wash:#f0f1ea;
  --brand:#b2347c; --brand-hover:#982a69; --brand-2:#fae7f1; --brand-ink:#7f1f57;
  --green:#47801f; --green-hover:#3b6c19; --green-2:#e9f3dc; --green-ink:#355f14;
  --blue:#b2347c; --blue-2:#fae7f1; --amber:#94570c; --amber-2:#fbefdb; --violet:#7a4fa3; --violet-2:#f1eaf8;
  --red:#a8322a; --red-2:#fbe6e2; --sun:#f2b75c;
  --font:"Mardoto","Noto Sans Armenian",-apple-system,system-ui,sans-serif;
  --r:16px; --tab:66px;
  --ease-out:cubic-bezier(.23,1,.32,1); --ease-drawer:cubic-bezier(.32,.72,0,1);
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font:400 16px/1.5 var(--font);-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
::selection{background:var(--brand-2);color:var(--brand-ink)}
input,button,select{font:inherit;color:inherit;caret-color:var(--green)}
button{cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:3px solid #e9a3c8;outline-offset:2px;border-radius:8px}
.num{font-variant-numeric:tabular-nums}

/* header */
.top{position:sticky;top:0;z-index:20;background:var(--paper);padding:calc(10px + env(safe-area-inset-top,0px)) max(18px,env(safe-area-inset-right,0px)) 10px max(18px,env(safe-area-inset-left,0px));border-bottom:1px solid transparent}
.top.sh{border-bottom-color:var(--line)}
.top-in{max-width:1120px;margin:0 auto;display:flex;align-items:center;gap:12px;min-height:44px}
.me{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.me-t{min-width:0}
.me-n{font-weight:700;font-size:17px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me-r{font-size:13px;color:var(--ink-2);line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:360px){.top-in{gap:4px}.me .av{display:none}.out{padding:10px 8px}}
.out{border:0;background:transparent;color:var(--ink-2);font-size:14px;font-weight:500;padding:10px 12px;border-radius:12px;min-height:44px}
@media (hover:hover) and (pointer:fine){.out:hover{background:var(--wash)}}
.bell{position:relative;border:0;background:transparent;color:var(--ink-2);width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:none}
@media (hover:hover) and (pointer:fine){.bell:hover{background:var(--wash)}}
.bell .badge{top:2px;left:auto;right:0}
.ib{padding:12px 0;border-top:1px solid var(--line)}.ib:first-child{border-top:0}
.ib b{display:block;font-size:16px}.ib p{margin:2px 0 0;color:var(--ink-2);font-size:15px}.ib time{font-size:13px;color:var(--ink-3)}
.ib.new{background:linear-gradient(90deg,var(--green-2),transparent 70%);margin:0 -20px;padding:12px 20px;border-radius:0}
.dtabs{display:none}

/* layout */
main{max-width:1120px;margin:0 auto;padding:8px max(18px,env(safe-area-inset-right,0px)) calc(var(--tab) + 32px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px))}
main.notabs{padding-bottom:calc(32px + env(safe-area-inset-bottom,0px))}
.stack{display:flex;flex-direction:column;gap:22px;min-width:0}
.stack>*,.two>*,section{min-width:0}
.row.wrap{flex-wrap:wrap}
@media (max-width:520px){.row.wrap>.sel,.row.wrap>.btn{flex:1 1 calc(100% - 52px);margin-left:52px;max-width:none}}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 0 6px}
.sec-h h2{font-size:19px;font-weight:700;margin:0;letter-spacing:-.005em}
.sec-h .c{font-size:14px;color:var(--ink-3);font-weight:500}
.panel{background:var(--card);border-radius:var(--r);box-shadow:0 1px 2px rgba(28,36,32,.06),0 0 0 1px rgba(28,36,32,.05);padding:4px 16px}
.empty{color:var(--ink-2);font-size:15px;padding:14px 0}

/* rows */
.row{display:flex;align-items:center;gap:12px;min-height:64px;padding:10px 0;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.row:first-child{border-top:0}
button.row:active{background:var(--wash)}
.av{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:14px;font-weight:600;letter-spacing:.02em}
.av.s-class{background:var(--brand-2);color:var(--brand-ink)} .av.s-play{background:var(--green-2);color:var(--green-ink)} .av.s-meal{background:var(--amber-2);color:var(--amber)}
.av.s-road{background:var(--violet-2);color:var(--violet)} .av.s-out{background:var(--wash);color:var(--ink-3)} .av.s-bad{background:var(--red-2);color:var(--red)}
.rm{flex:1;min-width:0}
.rn{font-size:16px;font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.rs{font-size:14px;color:var(--ink-2);line-height:1.35;margin-top:2px}
.rs.bad{color:var(--red)}
.rt{flex:none;font-size:14px;color:var(--ink-3);text-align:right}
.chev{flex:none;width:18px;height:18px;color:var(--ink-3)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;min-height:48px;padding:0 20px;font-size:16px;font-weight:600;background:var(--wash);color:var(--ink);text-decoration:none}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--green);color:#fff}
@media (hover:hover) and (pointer:fine){.btn.pri:hover{background:var(--green-hover)}}
.btn.sm{min-height:42px;padding:0 16px;font-size:15px}
.btn.full{width:100%}
.btn.line{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line)}

/* banner */
.due{display:flex;align-items:center;gap:14px;width:100%;border:0;text-align:left;background:linear-gradient(135deg,#c8448f,#9b2c6d);color:#fff;border-radius:var(--r);padding:16px 18px}
.due b{display:block;font-size:17px}
.due span{font-size:14px;opacity:.9}
.due svg{margin-left:auto;flex:none}
.due.late{background:var(--red)}

/* numbers */
.nums{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.nbox{border:0;background:var(--card);border-radius:14px;box-shadow:0 1px 2px rgba(28,36,32,.06),0 0 0 1px rgba(28,36,32,.05);padding:12px 14px;text-align:left;min-height:76px}
.nbox b{display:block;font-size:28px;font-weight:700;line-height:1.1}
.nbox span{font-size:13px;color:var(--ink-2)}
.nbox.on{box-shadow:0 0 0 2px var(--ink)}
.nbox.k-class b{color:var(--blue)} .nbox.k-play b{color:var(--green)} .nbox.k-meal b{color:var(--amber)} .nbox.k-road b{color:var(--violet)}
@media (max-width:640px){.nums{grid-template-columns:repeat(2,minmax(0,1fr))}}
.nbox span{display:block;overflow-wrap:anywhere;line-height:1.3}
.nbox{min-width:0}

/* alerts */
.alerts{display:flex;flex-direction:column;gap:8px}
.al{display:flex;gap:12px;align-items:flex-start;border-radius:14px;padding:12px 14px;font-size:15px;line-height:1.4;background:var(--red-2);color:var(--red);border:0;text-align:left;width:100%}
.al.w{background:var(--amber-2);color:var(--amber)}
.al i{flex:none;width:8px;height:8px;border-radius:50%;background:currentColor;margin-top:7px}
.ok{border-radius:14px;padding:12px 14px;font-size:15px;background:var(--green-2);color:var(--green-ink)}

/* search & filters */
.search{width:100%;border:0;border-radius:14px;background:var(--card);box-shadow:0 0 0 1px var(--line);padding:0 16px;min-height:48px;font-size:16px;margin:0 0 10px}
.search::placeholder{color:var(--ink-3)}
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -18px 10px;padding:0 18px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;border-radius:999px;background:var(--card);box-shadow:inset 0 0 0 1px var(--line);min-height:40px;padding:0 16px;font-size:15px;font-weight:500;color:var(--ink-2)}
.chip.on{background:var(--green);color:#fff;box-shadow:none}

/* route groups */
.grp{display:flex;flex-direction:column;gap:2px;padding:14px 0 4px;border-top:1px solid var(--line)}
.grp:first-child{border-top:0}
.grp b{font-size:16px}
.grp span{font-size:14px;color:var(--ink-2)}
.sel{border:0;border-radius:12px;background:var(--wash);min-height:42px;padding:0 12px;font-size:15px;max-width:150px}

/* tab bar */
.tabbar{position:fixed;z-index:20;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px);box-shadow:0 -1px 0 var(--line);display:flex;padding:0 max(8px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(8px,env(safe-area-inset-left,0px))}
.tab{flex:1;min-width:0;border:0;background:none;min-height:var(--tab);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:13px;font-weight:600;color:var(--ink-3);position:relative}
.tab svg{width:24px;height:24px}
.tab span:not(.badge){white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;font-size:12px}
.tab.on{color:var(--green)}
.badge{position:absolute;top:8px;left:calc(50% + 8px);min-width:20px;height:20px;border-radius:10px;background:var(--red);color:#fff;font-size:12px;font-weight:600;display:grid;place-items:center;padding:0 6px}

/* sheet */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(20,26,23,.38);opacity:0;transition:opacity .2s ease-out}
.scrim.in{opacity:1;transition-duration:.3s}
.sheet{position:fixed;z-index:41;left:0;right:0;bottom:0;max-height:88vh;overflow:auto;background:var(--card);border-radius:22px 22px 0 0;padding:10px 20px calc(20px + env(safe-area-inset-bottom,0px));transform:translateY(100%);transition:transform .2s var(--ease-out);will-change:transform;overscroll-behavior:contain;box-shadow:0 -10px 40px rgba(20,26,23,.18)}
.sheet.in{transform:none;transition:transform .34s var(--ease-drawer)}
.grab{width:40px;height:5px;border-radius:5px;background:var(--line);margin:0 auto 14px}
.sh-h{display:flex;align-items:center;gap:14px;margin-bottom:6px}
.sh-h .av{width:52px;height:52px;font-size:17px}
.sh-n{font-size:20px;font-weight:700;line-height:1.25}
.sh-s{font-size:15px;color:var(--ink-2);line-height:1.45;margin-top:4px}
.acts{display:flex;flex-direction:column;gap:10px;margin:18px 0 6px}
.tl{margin:18px 0 4px;padding:0;list-style:none}
.tl li{display:flex;gap:12px;padding:7px 0;font-size:15px;line-height:1.4}
.tl time{flex:none;width:48px;color:var(--ink-3)}
.tl i{flex:none;width:10px;height:10px;border-radius:50%;margin-top:6px}
.tl .k-class{background:var(--blue)} .tl .k-play{background:var(--green)} .tl .k-meal{background:var(--amber)} .tl .k-road{background:var(--violet)} .tl .k-out{background:var(--ink-3)}
.sh-sub{font-size:13px;font-weight:600;color:var(--ink-3);margin:18px 0 0}
.code-l{font-size:14px;color:var(--ink-2);margin-top:4px}.code-l b{color:var(--ink);font-size:17px;letter-spacing:.08em}
.team-acts{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
@media (max-width:520px){.team-acts{margin-left:52px;width:calc(100% - 52px)}.team-acts .btn{flex:1}}
.kform{display:flex;flex-direction:column;gap:10px}
.kform label{display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--ink-2)}
.kform input,.crow input,.sched input{border:0;border-radius:12px;background:var(--wash);min-height:46px;padding:0 12px;font-size:16px;width:100%;min-width:0}
.kform .sel{max-width:none;width:100%;min-height:46px}
.two-f{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.crow{display:grid;grid-template-columns:1.2fr 1fr 1.2fr 36px;gap:6px;align-items:center}
@media (max-width:480px){.crow{grid-template-columns:1fr 1fr 36px}.crow input[data-k="phone"]{grid-column:1 / 3}}
.crow .del{flex:none;border:0;background:var(--wash);color:var(--ink-3);border-radius:10px;width:36px;height:36px}
.sched{display:grid;grid-template-columns:44px 1fr 1fr;gap:6px 10px;align-items:center}
.monthbar{display:flex;align-items:center;justify-content:space-between;gap:12px}.monthbar b{font-size:18px}
.doc{font-size:16px;line-height:1.6}.doc h1{font-size:21px;line-height:1.3;margin:6px 0 10px}.doc h2{font-size:18px;margin:18px 0 6px}.doc h3{font-size:16px;margin:14px 0 4px}
.doc h4{font-size:15px;margin:14px 0 2px;color:var(--green)}.doc p{margin:8px 0}.doc ul,.doc ol{padding-left:22px;margin:6px 0}.doc li{margin:4px 0}.doc table{font-size:14px}.doc td,.doc th{white-space:normal;vertical-align:top;min-width:90px}
.hbtn{position:relative;border:0;background:transparent;color:var(--ink-2);width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:none}
@media (hover:hover) and (pointer:fine){.hbtn:hover{background:var(--wash)}}.hbtn .dot{position:absolute;top:9px;right:9px;width:9px;height:9px;border-radius:50%;background:var(--brand)}
.tl .del{flex:none;border:0;background:var(--wash);color:var(--ink-3);border-radius:10px;width:36px;height:32px;margin-left:6px}
.skel{display:grid;gap:10px;padding:6px 0 18px}.skel i{display:block;height:14px;border-radius:7px;background:linear-gradient(90deg,var(--wash) 0%,var(--line) 50%,var(--wash) 100%);background-size:200% 100%;animation:sk 1.2s linear infinite}.skel i.h{height:22px;width:70%;margin-bottom:6px}.skel i:nth-child(3n){width:85%}.skel i:nth-child(4n){width:60%}
@keyframes sk{to{background-position:-200% 0}}
.sheet.drag{transition:none}
.grab{touch-action:none;cursor:grab;position:relative}.grab::before{content:"";position:absolute;inset:-14px -60px}
@keyframes fin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes op{from{opacity:.4}to{opacity:1}}
@keyframes tin{from{opacity:0;transform:translateY(12px) scale(.97)}to{opacity:1;transform:none}}
@keyframes flash{0%{background:var(--green-2)}100%{background:transparent}}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.15)}100%{transform:none}}
.fade-in{animation:fin .22s var(--ease-out)}
.tab-in{animation:op .16s ease-out}
.toast{animation:tin .22s var(--ease-out);transition:opacity .16s ease-out}
.toast.bye{opacity:0}
.row.flash{animation:flash 1.1s ease-out;border-radius:12px}
.busy{pointer-events:none;opacity:.55}
.btn.busy{opacity:1;position:relative;color:transparent!important}
.btn.busy::after{content:"";position:absolute;left:50%;top:50%;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;border:2.5px solid var(--line);border-top-color:var(--green);animation:spin .7s linear infinite}
.btn.pri.busy::after{border-color:rgba(255,255,255,.4);border-top-color:#fff}
@keyframes spin{to{transform:rotate(360deg)}}
.dots.shake{animation:shake .38s ease-out}
.badge.pop,.dot.pop{animation:pop .3s var(--ease-out)}
button,.btn,.row,.tab,.chip,.nbox,.key{transition:background-color .15s ease,transform .12s var(--ease-out),box-shadow .15s ease}
.nbox:active,.chip:active,.due:active,.al:active,.hbtn:active,.bell:active,.out:active,.back:active{transform:scale(.97)}
.tab:active svg{transform:scale(.9)}.tab svg{transition:transform .12s var(--ease-out)}
button.row:active,.row [data-act]:active{background:var(--wash)}
.av{transition:background-color .25s ease,color .25s ease}
@media (prefers-reduced-motion:reduce){.sheet,.sheet.in{transition:none}.btn:active,.nbox:active,.chip:active,.key:active{transform:none}.fade-in,.toast,.dots.shake,.badge.pop,.dot.pop{animation:none}.skel i{animation:none}}

/* login */
.login{max-width:440px;margin:0 auto;padding-top:4vh}
.login h1{font-size:28px;font-weight:700;margin:0 0 4px;letter-spacing:-.01em}
.login p{color:var(--ink-2);margin:0 0 18px}
.code{display:flex;gap:10px;justify-content:center;margin:18px 0 8px}
.code span{width:44px;height:56px;border-radius:12px;background:var(--card);box-shadow:inset 0 0 0 1.5px var(--line);display:grid;place-items:center;font-size:26px;font-weight:600}
.code span.f{box-shadow:inset 0 0 0 2px var(--green)}
.dots{display:flex;gap:10px;justify-content:center;margin:22px 0 6px}
.dots span{width:16px;height:16px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--ink-3)}
.dots span.on{background:var(--green);box-shadow:none}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:10px auto 18px;max-width:320px}
.key{border:0;border-radius:18px;background:var(--card);box-shadow:0 1px 2px rgba(28,36,32,.08),0 0 0 1px var(--line);height:64px;font-size:26px;font-weight:600;color:var(--ink);touch-action:manipulation;-webkit-user-select:none;user-select:none}
.key:active{background:var(--wash);transform:scale(.97)}
.key.del{background:transparent;box-shadow:none;font-size:24px;color:var(--ink-2)}
.pinfield{-webkit-text-security:disc;text-security:disc;display:block;width:100%;border:0;border-radius:14px;background:var(--card);box-shadow:inset 0 0 0 1.5px var(--line);min-height:64px;padding:0 16px;font-size:28px;letter-spacing:.45em;text-align:center;margin:6px 0 4px}
.pinfield:focus{outline:none;box-shadow:inset 0 0 0 2px var(--green)}
.pinfield::placeholder{color:var(--ink-3);letter-spacing:.45em}
.err{color:var(--red);font-size:15px;min-height:22px;text-align:center}
.back{border:0;background:none;color:var(--ink-2);font-size:15px;padding:10px 0;min-height:44px}

/* install hint, toast, offline */
.hint{display:flex;gap:12px;align-items:flex-start;background:var(--card);border-radius:var(--r);box-shadow:0 0 0 1px var(--line);padding:14px 16px;font-size:15px}
.hint-ic{flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--green-2);color:var(--green-ink)}
.hint b{display:block}
.hint .x{margin-left:auto;border:0;background:none;color:var(--ink-3);padding:4px 8px;min-height:36px}
.toast{position:fixed;z-index:50;left:0;right:0;margin:0 auto;width:max-content;bottom:calc(var(--tab) + 16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:#fff;border-radius:16px;padding:8px 8px 8px 18px;display:flex;gap:14px;align-items:center;font-size:15px;max-width:calc(100% - 32px);box-shadow:0 10px 30px rgba(20,26,23,.25)}
.toast button{border:0;background:rgba(255,255,255,.14);color:#fff;border-radius:12px;min-height:40px;padding:0 14px;font-weight:600}
main.notabs ~ .toast{bottom:calc(20px + env(safe-area-inset-bottom,0px))}
.off{background:var(--amber-2);color:var(--amber);border-radius:14px;padding:12px 14px;font-size:15px}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{text-align:left;padding:10px 8px;border-top:1px solid var(--line);white-space:nowrap}
th{font-size:13px;color:var(--ink-3);font-weight:600;border-top:0}
.form{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;padding:12px 0}
.form label{display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--ink-2)}
.form input{border:0;border-radius:12px;background:var(--wash);min-height:48px;padding:0 14px;font-size:16px;width:140px}

/* desktop */
@media (min-width:960px){
  .tabbar{display:none}
  main{padding-bottom:48px}
  .dtabs{display:flex;gap:4px;margin:0 auto}
  .dtab{border:0;background:none;border-radius:12px;min-height:44px;padding:0 16px;font-size:15px;font-weight:600;color:var(--ink-2);display:flex;align-items:center;gap:8px;position:relative}
  .dtab.on{background:var(--card);color:var(--green);box-shadow:0 0 0 1px var(--line)}
  .dtab .badge{position:static}
  .two{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:28px;align-items:start}
  .sheet{left:auto;top:0;width:440px;max-height:none;border-radius:22px 0 0 22px;transform:translateX(100%);padding-top:28px}
  .sheet.in{transform:none}
  .grab{display:none}
  .toast{bottom:28px}
}
</style>
</head>
<body>
<header class="top" id="top"><div class="top-in" id="hdr"></div></header>
<main id="app" class="notabs"><div class="empty">Բեռնվում է…</div></main>
<nav class="tabbar" id="tabbar" hidden></nav>
<div id="sheetbox"></div>
<div id="toast" class="toast" role="status" hidden></div>

<script>
const API="https://script.google.com/macros/s/AKfycbyq-9XatEqTnFvL1Fhn3V9BSM1RwRVRKiK1bjCJbarBvAYx8Z_fHdxRKb6n98E8fH8CBw/exec";

/* ---------- icons ---------- */
const IC={
  now:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>',
  road:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20 8.5 4M20 20 15.5 4M12 6v2.5M12 11v2.5M12 16v2.5"/></svg>',
  report:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>',
  lessons:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6.5C6.5 5 9.5 5 12 6.5 14.5 5 17.5 5 20 6.5V19c-2.5-1.5-5.5-1.5-8 0-2.5-1.5-5.5-1.5-8 0z"/><path d="M12 6.5V19"/></svg>',
  pay:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="2.5"/><path d="M3 10h18M7 15h3"/></svg>',
  team:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19c.8-3.2 3-5 5.5-5s4.7 1.8 5.5 5"/><circle cx="17" cy="9" r="2.4"/><path d="M16 14.2c2.2.2 3.8 1.8 4.5 4.3"/></svg>',
  door:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 20V5a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v15M4 20h16"/><circle cx="14.5" cy="12.5" r=".9" fill="currentColor"/></svg>',
  chev:'<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>',
  arrow:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>'
};

/* ---------- state ---------- */
const S={staffList:[],staff:[],kids:[],marks:[],routes:[],week:null,settings:{playMax:60,mealAfter:120,teacherMax:3,sessionMax:50},
  me:null,code:"",pick:null,pin:"",pinErr:"",phase:"boot",tab:null,filter:"all",q:"",sheet:null,offline:false,lastId:null,busyPin:false,sheetUrl:""};
const ls={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}};

const NOW=()=>Date.now()+(S.offset||0);
const pad=n=>String(n).padStart(2,"0");
const dayKey=x=>{const d=new Date(x);return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())};
const hm=x=>{const d=new Date(x);return pad(d.getHours())+":"+pad(d.getMinutes())};
const mins=ms=>Math.max(0,Math.round(ms/60000));
const dur=ms=>{const m=mins(ms);return m<60?m+" ր":Math.floor(m/60)+" ժ "+pad(m%60)+" ր"};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ini=n=>String(n||"").split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join("").toUpperCase();
const staffById=id=>S.staff.find(s=>s.id===id)||S.staffList.find(s=>s.id===id);
const sname=id=>(staffById(id)||{}).name||"ոչ ոք";
const meS=()=>staffById(S.me);
const kidById=id=>S.kids.find(k=>k.id===id);
const kidName=id=>(kidById(id)||{}).name||"—";
const workers=()=>S.staff.filter(s=>s.active!==false);
const activeKids=()=>S.kids.filter(k=>k.active!==false);
const absentIds=()=>new Set(S.marks.filter(m=>m.kind==="absent").map(m=>m.kid));
const liveRoutes=()=>{const ab=absentIds(),act=new Set(activeKids().map(k=>k.id));return (S.routes||[]).filter(r=>act.has(r.kid)&&!ab.has(r.kid))};
const mySubjects=()=>{const me=meS();return me?(me.subjects&&me.subjects.length?me.subjects:(me.subject?[me.subject]:[])):[]};
const ROLE={owner:"տնօրեն",coord:"համակարգող",teacher:"մանկավարժ",cook:"խոհարար"};
const roleLine=s=>s?(s.role==="teacher"||s.role==="coord")&&s.subject?(s.role==="coord"?"համակարգող · ":"")+s.subject:ROLE[s.role]||"":"";
const grade=k=>k.grade?k.grade+"-րդ դասարան":"";

/* ---------- day model ---------- */
function derive(marks){
  const kids={};
  activeKids().forEach(k=>kids[k.id]={...k,inCenter:false,place:"none",since:null,teacher:null,subject:null,ate:false,done:{},arrivedAt:null,events:[],absent:false});
  const sessions=[],open={};
  [...marks].sort((a,b)=>a.at-b.at).forEach(m=>{
    const k=kids[m.kid];if(!k)return;
    const close=res=>{const o=open[m.kid];if(o){o.end=m.at;o.result=res;delete open[m.kid]}};
    const free=()=>{k.teacher=null;k.subject=null};
    if(m.kind==="absent"){if(!k.inCenter&&k.place==="none"){k.absent=true;k.place="absent";k.since=m.at}}
    else if(m.kind==="arrive"){close("closed");k.absent=false;k.inCenter=true;k.place="play";k.since=m.at;k.arrivedAt=k.arrivedAt||m.at;free()}
    else if(m.kind==="take"){close("closed");k.inCenter=true;k.arrivedAt=k.arrivedAt||m.at;k.place="class";k.since=m.at;k.teacher=m.staff;k.subject=m.subject;
      const s={kid:m.kid,teacher:m.staff,subject:m.subject,start:m.at,end:null,result:null,day:m.day};sessions.push(s);open[m.kid]=s;k.events.push({at:m.at,sess:s,id:m.id})}
    else if(m.kind==="done"||m.kind==="stop"){const o=open[m.kid];if(o){o.end=m.at;o.result=m.kind==="done"?"done":"not_done";delete open[m.kid];if(m.kind==="done")k.done[o.subject]=m.at}
      k.place="play";k.since=m.at;free()}
    else if(m.kind==="meal"){close("closed");k.place="meal";k.since=m.at;free()}
    else if(m.kind==="ate"){k.ate=true;k.place="play";k.since=m.at}
    else if(m.kind==="play"){close("closed");k.place="play";k.since=m.at;free()}
    else if(m.kind==="home"){close("closed");k.inCenter=false;k.place="home";k.since=m.at;k.leftAt=m.at;free()}
    else if(m.kind==="pickup"){close("closed");k.inCenter=false;k.place="road";k.since=m.at;k.escort=m.staff;free()}
    else if(m.kind==="dropoff"){close("closed");k.inCenter=false;k.place="school";k.since=m.at;k.escort=m.staff;free()}
    if(m.kind!=="take")k.events.push({at:m.at,m,id:m.id,hide:m.kind==="done"||m.kind==="stop"});
  });
  return {kids:Object.values(kids).sort((a,b)=>a.name.localeCompare(b.name,"hy")),sessions};
}
function state(k,now){
  const st=S.settings;
  if(k.place==="class"){const bad=now-k.since>st.sessionMax*60000;return {c:bad?"bad":"class",w:"Դասին · "+sname(k.teacher),t:dur(now-k.since)}}
  if(k.place==="play"){const bad=!Object.keys(k.done).length&&now-k.since>st.playMax*60000;return {c:bad?"bad":"play",w:"Խաղասենյակ",t:dur(now-k.since)}}
  if(k.place==="meal") return {c:"meal",w:"Ճաշ",t:dur(now-k.since)};
  if(k.place==="road") return {c:"road",w:"Ճանապարհին · "+sname(k.escort),t:dur(now-k.since)};
  if(k.place==="school") return {c:"out",w:"Դպրոցում",t:hm(k.since)+"-ից"};
  if(k.place==="home") return {c:"out",w:"Գնացել է տուն",t:hm(k.since)};
  if(k.place==="absent") return {c:"out",w:"Այսօր չի գալու",t:""};
  return {c:"out",w:"Դեռ չի եկել",t:""};
}
function timeline(k,now){
  return k.events.filter(e=>!e.hide).map(e=>{
    if(e.sess){const s=e.sess,end=s.end||now,r=s.result==="done"?" · արեց":s.result==="not_done"?" · չավարտեց":s.end?"":" · հիմա";
      return {at:e.at,id:e.id,c:"class",txt:`${s.subject||"Դաս"} · ${sname(s.teacher)} · ${dur(end-s.start)}${r}`}}
    const m=e.m,W=m.who?" · "+m.who:"",T={arrive:["play","Եկավ կենտրոն"+W],meal:["meal","Նստեց ուտելու"],ate:["meal","Կերավ"],play:["play","Խաղասենյակ"],home:["out","Գնաց տուն"+W],pickup:["road","Դպրոցից վերցրեց՝ "+sname(m.staff)],dropoff:["road","Տարավ դպրոց՝ "+sname(m.staff)],absent:["out","Այսօր չի գալու · նշեց "+sname(m.staff)]}[m.kind]||["out",m.kind];
    return {at:m.at,id:e.id,c:T[0],txt:T[1]};
  });
}

/* ---------- routes ---------- */
const atToday=x=>{const [h,m]=String(x).split(":").map(Number);const d=new Date(NOW());d.setHours(h||0,m||0,0,0);return d.getTime()};
function rstat(r,now){
  const tt=atToday(r.time),ms=S.marks.filter(m=>m.kid===r.kid).sort((a,b)=>a.at-b.at);
  const done=r.kind==="pickup"?ms.find(m=>(m.kind==="pickup"||m.kind==="arrive")&&m.at>=tt-30*60000):ms.find(m=>m.kind==="dropoff"&&m.at>=tt-90*60000);
  if(done) return {st:"done",at:done.at,by:done.staff};
  if(r.kind==="pickup") return {st:now>tt+15*60000?"late":now>=tt-15*60000?"now":"wait"};
  return {st:now>tt+5*60000?"late":now>=tt-20*60000?"now":"wait"};
}
const rword=(r,s)=>s.st==="done"?(r.kind==="pickup"?"Վերցրել են ":"Տարել են ")+hm(s.at):s.st==="late"?(r.kind==="pickup"?"Չեն վերցրել":"Չեն տարել"):s.st==="now"?"Ժամն է":"";
function groupsOf(list){const g=[];list.forEach(r=>{const key=r.time+"|"+r.school+"|"+r.kind;let x=g.find(y=>y.key===key);if(!x){x={key,r,items:[]};g.push(x)}x.items.push(r)});return g}

/* ---------- alerts ---------- */
function alerts(D,now){
  const out=[],st=S.settings;
  liveRoutes().forEach(r=>{if(rstat(r,now).st!=="late")return;
    out.push({w:r.kind!=="pickup",kid:r.kid,txt:r.kind==="pickup"?`${kidName(r.kid)} — դասերն ավարտվել են ${r.time}-ին, չեն վերցրել · ${sname(r.staff)}`:`${kidName(r.kid)} — ${r.time}-ին պետք է տարվեր դպրոց · ${sname(r.staff)}`})});
  D.kids.forEach(k=>{if(!k.inCenter)return;
    if(k.place==="play"&&!Object.keys(k.done).length&&now-k.since>st.playMax*60000)out.push({kid:k.id,txt:`${k.name} — ${dur(now-k.since)} խաղասենյակում, դասեր չի արել`});
    if(k.place==="class"&&now-k.since>st.sessionMax*60000)out.push({w:1,kid:k.id,txt:`${k.name} — ${dur(now-k.since)} դասին · ${sname(k.teacher)}`});
    if(!k.ate&&k.place!=="meal"&&k.arrivedAt&&now-k.arrivedAt>st.mealAfter*60000)out.push({w:1,kid:k.id,txt:`${k.name} — կենտրոնում է ${hm(k.arrivedAt)}-ից, դեռ չի կերել`});
  });
  S.staff.filter(s=>s.role==="teacher"||s.role==="coord").forEach(s=>{const n=D.kids.filter(k=>k.place==="class"&&k.teacher===s.id).length;
    if(n>st.teacherMax)out.push({w:1,txt:`${s.name} — միաժամանակ ${n} երեխա (նորման՝ ${st.teacherMax})`})});
  return out;
}

/* ---------- pieces ---------- */
const matchQ=k=>{const q=S.q.trim().toLowerCase();return !q||k.name.toLowerCase().includes(q)};
const search=()=>`<input class="search" id="q" type="search" placeholder="Որոնել անունով" value="${esc(S.q)}" autocomplete="off" enterkeyhint="search">`;
function kidRow(k,now,opts={}){
  const s=state(k,now);
  return `<button class="row" data-act="open" data-kid="${esc(k.id)}"><div class="av s-${s.c}">${esc(ini(k.name))}</div><div class="rm"><div class="rn">${esc(k.name)}</div><div class="rs${s.c==="bad"?" bad":""}">${esc(opts.sub||s.w)}</div></div><div class="rt num">${esc(opts.right??s.t)}</div>${IC.chev}</button>`;
}
const sec=(title,count,body,extra="")=>`<section><div class="sec-h"><h2>${title}</h2>${count!=null?`<span class="c num">${count}</span>`:""}${extra}</div>${body}</section>`;
const panel=inner=>`<div class="panel">${inner}</div>`;
const emptyP=t=>panel(`<div class="empty">${t}</div>`);

function dueBanner(now){
  const mine=liveRoutes().filter(r=>r.staff===S.me).map(r=>({r,s:rstat(r,now)})).filter(x=>x.s.st==="now"||x.s.st==="late");
  if(!mine.length) return "";
  const r=mine[0].r,n=mine.filter(x=>x.r.time===r.time&&x.r.school===r.school&&x.r.kind===r.kind).length,late=mine.some(x=>x.s.st==="late");
  return `<button class="due${late?" late":""}" data-act="myroute"><div><b>${r.kind==="pickup"?"Ժամն է գնալ դպրոց":"Ժամն է տանել դպրոց"}</b><span class="num">${esc(r.time)} · ${esc(r.school||"")} · ${n} երեխա</span></div>${IC.arrow}</button>`;
}
function pushCard(){
  const ios=/iphone|ipad|ipod/i.test(navigator.userAgent),standalone=window.matchMedia("(display-mode: standalone)").matches||navigator.standalone;
  if(!("Notification" in window)||!("serviceWorker" in navigator)||!("PushManager" in window)){
    return ios&&!standalone?`<div class="hint"><span class="hint-ic" aria-hidden="true"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg></span><div><b>Ծանուցումներ</b>Ծանուցումներ ստանալու համար նախ ավելացրեք հավելվածը գլխավոր էկրանին և բացեք այնտեղից։</div></div>`:"";}
  if(Notification.permission==="denied")return `<div class="hint"><span class="hint-ic" aria-hidden="true"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg></span><div><b>Ծանուցումներն անջատված են</b>Միացրեք դրանք հեռախոսի կարգավորումներում՝ Վիկտորյա հավելվածի համար։</div></div>`;
  if(Notification.permission==="granted")return "";
  return `<div class="hint"><span class="hint-ic" aria-hidden="true"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg></span><div><b>Միացրեք ծանուցումները</b>Կիմանաք, երբ է ժամը գնալ դպրոց${meS()&&meS().role!=="teacher"?", և եթե ինչ-որ բան այն չէ":""}։<div style="margin-top:10px"><button class="btn sm pri" data-act="push-on">Միացնել</button></div></div></div>`;
}
const b64uToU8=s=>{const p="=".repeat((4-s.length%4)%4),b=atob((s+p).replace(/-/g,"+").replace(/_/g,"/"));return Uint8Array.from(b,c=>c.charCodeAt(0))};
async function subscribePush(test){
  const reg=await navigator.serviceWorker.ready;
  let sub=await reg.pushManager.getSubscription();
  if(!sub){const key=await api("api_vapidKey");sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64uToU8(key)})}
  await api("api_pushSubscribe",S.code,sub.endpoint);ls.set("vk-push-me",S.me);
  if(test)await api("api_pushTest",S.code);
}
async function enablePush(){
  try{const perm=await Notification.requestPermission();
    if(perm!=="granted"){toast("Ծանուցումները չեն միացվել");render();return}
    render();toast("Միացնում եմ…");await subscribePush(true);toast("Ծանուցումները միացված են։ Փորձնական ծանուցումը կգա մի քանի վայրկյանից։")}
  catch(e){toast("Ծանուցումները թույլատրված են։ Միացումը կավարտվի ավտոմատ։");render()}
}
function installHint(){
  if(ls.get("vk-hint")==="1"||window.matchMedia("(display-mode: standalone)").matches||navigator.standalone) return "";
  const ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
  const how=ios?"Safari-ում սեղմեք «Կիսվել» կոճակը, հետո «Գլխավոր էկրանին»":(S.installEvt?"":"Բրաուզերի մենյուում ընտրեք «Ավելացնել գլխավոր էկրանին»");
  return `<div class="hint"><span class="hint-ic" aria-hidden="true"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="3" width="10" height="18" rx="2"/><path d="M11 18h2"/></svg></span><div><b>Ավելացրեք հեռախոսի էկրանին</b>${how}${S.installEvt?`<div style="margin-top:8px"><button class="btn sm pri" data-act="install">Տեղադրել</button></div>`:""}</div><button class="x" data-act="hint-x" aria-label="Փակել">✕</button></div>`;

function report(sessions,now){
  const today=S.day||dayKey(now),g={};
  sessions.forEach(s=>{const key=s.teacher+"|"+s.subject;const r=(g[key]=g[key]||{teacher:s.teacher,subject:s.subject,n:0,sum:0,max:0,done:0,open:0,list:[]});
    const ok=s.result==="done"||s.result==="not_done";
    if(!ok){if(s.end||s.day!==today)r.open++;return}
    const ms=s.end-s.start;if(ms<60000)return;r.n++;r.sum+=ms;r.max=Math.max(r.max,ms);if(s.result==="done")r.done++;r.list.push({...s,ms})});
  Object.keys(g).forEach(k=>{if(!g[k].n&&!g[k].open)delete g[k]});
  const by={};Object.values(g).forEach(r=>{const b=(by[r.subject]=by[r.subject]||{n:0,sum:0});b.n+=r.n;b.sum+=r.sum});const avgOf=(a,b)=>b?a/b:0;
  const rows=Object.values(g).sort((a,b)=>String(a.subject).localeCompare(String(b.subject),"hy"));
  const long=[];rows.forEach(r=>{const avg=avgOf(by[r.subject].sum,by[r.subject].n);r.list.forEach(s=>{if(s.ms>=10*60000&&s.ms>avg*1.5)long.push({...s,avg})})});
  return {rows,by,long:long.sort((a,b)=>b.ms-a.ms).slice(0,8)};
}

/* ---------- документы ---------- */
function isOwner(){const m=meS();return !!m&&m.role==="owner"}
function docsUnreadN(){return isOwner()?0:(S.docs||[]).filter(d=>!d.readAt).length}
/* Илоне: кто из сотрудников прочитал документ (кнопки «Կարդացել եմ» у неё нет) */
function docWho(d){const r=S.docReads;if(!r)return null;const meta=r.docs.find(x=>x.id===d.id);if(!meta)return null;
  const team=(S.staff||[]).filter(x=>x.active!==false&&x.role!=="owner"&&(meta.roles.includes("all")||meta.roles.includes(x.role)));
  const rd=x=>(r.reads[x.id]||{})[d.id+"|"+meta.version];
  return {yes:team.filter(rd),no:team.filter(x=>!rd(x)),n:team.length}}
function docsHtml(){
  const l=S.docs;
  if(!l)return `<div class="sh-n">Փաստաթղթեր</div><div class="skel"><i></i><i></i><i></i><i></i></div>`;
  const groups=[];l.forEach(d=>{let g=groups.find(x=>x.n===d.group);if(!g){g={n:d.group,items:[]};groups.push(g)}g.items.push(d)});
  return `<div class="sh-n">Փաստաթղթեր</div><div class="sh-s" style="margin-bottom:8px">${isOwner()?"Կենտրոնի բոլոր փաստաթղթերը և ով է դրանք կարդացել։":"Կարդացեք ձեր հրահանգները և սեղմեք «Կարդացել եմ»։"}</div>
    ${l.length?groups.map(g=>`<div class="sh-sub">${esc(g.n||"")}</div>`+g.items.map(d=>`<button class="row" data-act="doc-open" data-id="${esc(d.id)}">${isOwner()?(()=>{const w=docWho(d);const all=w&&w.n&&w.yes.length===w.n;return `<div class="av s-${!w?"out":all?"play":"meal"}">${!w?"…":w.yes.length+"/"+w.n}</div><div class="rm"><div class="rn">${esc(d.title.split(" — ")[0])}</div><div class="rs">${!w?"Ստուգում եմ…":!w.n?"Աշխատակից չկա այս դերով":all?"Բոլորը կարդացել են":"Կարդացել է "+w.yes.length+" աշխատակից "+w.n+"-ից"}</div></div>`})():`<div class="av s-${d.readAt?"play":"meal"}">${d.readAt?"✓":"!"}</div><div class="rm"><div class="rn">${esc(d.title.split(" — ")[0])}</div><div class="rs">${d.readAt?"Կարդացել եք · "+new Date(d.readAt).toLocaleDateString("ru-RU"):"Դեռ չեք կարդացել"}</div></div>`}${IC.chev}</button>`).join("")).join(""):`<div class="empty">Փաստաթղթեր դեռ չկան։</div>`}
    <div class="acts"><button class="btn full line" data-act="close">Փակել</button></div>`;
}
const DOCC=(()=>{try{return JSON.parse(localStorage.getItem("vk-docs")||"{}")}catch(e){return {}}})();
function docCacheSave(){try{localStorage.setItem("vk-docs",JSON.stringify(DOCC))}catch(e){}}
function docPrefetch(){const l=S.docs||[];const miss=l.filter(d=>!DOCC[d.id]||DOCC[d.id].v!==d.version).map(d=>d.id);
  if(!miss.length||S.docFetching)return;S.docFetching=1;
  api("api_docBodies",S.code,miss).then(r=>{r.forEach(d=>DOCC[d.id]={v:d.version,html:d.html});docCacheSave();S.docFetching=0}).catch(()=>{S.docFetching=0})}
function docHtml(){
  const d=S.doc;
  if(!d)return `<div class="skel" aria-label="Բեռնվում է…"><i class="h"></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>`;
  const meta=(S.docs||[]).find(x=>x.id===d.id)||{};
  return `<button class="back" data-act="docs">← Բոլոր փաստաթղթերը</button><div class="doc">${cleanHtml(d.html)}</div>
    <div class="acts">${isOwner()?(()=>{const w=docWho(d);if(!w)return "";if(!w.n)return `<div class="sh-s">Այս փաստաթուղթը դեռ ոչ մեկին չի վերաբերում։</div>`;return (w.yes.length?`<div class="ok">Կարդացել են՝ ${w.yes.map(x=>esc(x.name)).join(", ")}</div>`:"")+(w.no.length?`<div class="al w"><i></i><span>Դեռ չեն կարդացել՝ ${w.no.map(x=>esc(x.name)).join(", ")}</span></div>`:"")})():meta.readAt?`<div class="ok">Կարդացել եք · ${new Date(meta.readAt).toLocaleDateString("ru-RU")}</div>`:`<button class="btn full pri" data-act="doc-read" data-id="${esc(d.id)}">Կարդացել եմ</button>`}<button class="btn full line" data-act="close">Փակել</button></div>`;
}
function cleanHtml(h){const t=document.createElement("template");t.innerHTML=h;const ok=new Set(["H1","H2","H3","H4","P","UL","OL","LI","B","STRONG","I","EM","TABLE","THEAD","TBODY","TR","TH","TD","BR","HR"]);
  const walk=n=>{[...n.childNodes].forEach(c=>{if(c.nodeType===1){if(/^(SCRIPT|STYLE|IFRAME|OBJECT|EMBED|TEMPLATE)$/.test(c.tagName)){c.remove();return}if(!ok.has(c.tagName)){c.replaceWith(...c.childNodes);walk(n);return}[...c.attributes].forEach(a=>c.removeAttribute(a.name));walk(c)}})};walk(t.content);
  t.content.querySelectorAll("table").forEach(tb=>{const w=document.createElement("div");w.className="tbl";tb.replaceWith(w);w.appendChild(tb)});
  return t.innerHTML}

/* ---------- api ---------- */
async function api(fn,...args){
  let r;try{r=await fetch(API,{method:"POST",body:JSON.stringify({fn,args}),redirect:"follow"})}catch(e){throw new Error("offline")}
  let j;try{j=await r.json()}catch(e){throw new Error("offline")}
  if(!j.ok)throw new Error(j.error||"error");return j.data;
}
/* очередь отметок без интернета */
const Q={get:()=>{try{return JSON.parse(ls.get("vk-q")||"[]")}catch(e){return[]}},set:q=>ls.set("vk-q",q.length?JSON.stringify(q):null)};
function queuedAsMarks(){return Q.get().map(q=>({id:q.tmp,kind:q.kind,kid:q.kid,staff:S.me,subject:q.subject||"",at:q.tapAt+(S.offset||0),day:S.day,pending:1}))}
let flushing=false;
async function flush(){
  if(flushing||!S.code)return;const q=Q.get();if(!q.length)return;flushing=true;
  try{for(const item of q){try{await api("api_mark",S.code,item.kind,item.kid,item.subject||"",item.tapAt,Date.now());Q.set(Q.get().filter(x=>x.tmp!==item.tmp))}catch(e){if(e.message==="offline")break;Q.set(Q.get().filter(x=>x.tmp!==item.tmp))}}}
  finally{flushing=false}
}
let toastT;
function hideToast(){const el=document.getElementById("toast");if(el.hidden)return;el.classList.add("bye");clearTimeout(toastT);toastT=setTimeout(()=>{el.hidden=true;el.classList.remove("bye")},170)}
function toast(text,undo){
  const el=document.getElementById("toast");
  el.innerHTML=`<span>${esc(text)}</span>`+(undo?`<button id="undo">Չեղարկել</button>`:"");
  el.classList.remove("bye");if(!el.hidden){el.style.animation="none";void el.offsetWidth;el.style.animation=""}
  el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{hideToast();S.lastId=null},undo?60000:3200);
  const b=document.getElementById("undo");
  if(b)b.onclick=async()=>{const id=S.lastId;S.lastId=null;hideToast();if(!id)return;
    const m=S.marks.find(x=>x.id===id);S.marks=S.marks.filter(x=>x.id!==id);render();
    if(String(id).startsWith("tmp")){if(m)m.cancelled=1;return}
    try{await api("api_undo",S.code,id)}catch(e){toast("Չհաջողվեց չեղարկել");refresh()}};
}

async function mark(kind,kid,subject,who,other){
  const me=meS();if(!me)return;
  if(kind==="take"&&!subject)subject=mySubjects()[0]||"";
  const tapAt=Date.now();
  const tmp={id:"tmp"+tapAt,kind,kid,staff:S.me,subject:kind==="take"?subject:"",at:NOW(),day:S.day,who:(other?"⚠ ":"")+(who||"")};
  S.marks.push(tmp);if(S.sheet&&S.sheet.type==="kid")S.sheet=null;render();flashKid(kid);
  try{navigator.vibrate&&navigator.vibrate(12)}catch(e){}
  S.lastId=tmp.id;toast(kid==="*"?KT[kind]:kidName(kid)+" — "+KT[kind],true);
  try{const r=await api("api_mark",S.code,kind,kid,subject||"",tapAt,Date.now(),who||"",other?1:0);
    if(tmp.cancelled){try{await api("api_undo",S.code,r.id)}catch(e){refresh()}return}
    tmp.id=r.id;tmp.at=r.at;if(S.lastId===("tmp"+tapAt))S.lastId=r.id}
  catch(e){
    if(e.message==="offline"){const q=Q.get();q.push({tmp:tmp.id,kind,kid,subject:subject||"",tapAt});Q.set(q);tmp.pending=1;S.offline=true;render();toast("Կապ չկա։ Նշումը կուղարկվի, երբ կապը վերականգնվի։")}
    else{S.marks=S.marks.filter(m=>m!==tmp);if(S.lastId===tmp.id){S.lastId=null;hideToast()}render();if(/bad_pin|locked/.test(e.message))logout("Կոդը այլևս չի գործում։ Մուտք գործեք նորից։");else toast(/no_right/.test(e.message)?"Այս նշումը ձեզ համար չէ։":"Չպահպանվեց։ Փորձեք նորից։")}}
}

  S.unread=st.unread||0;setBadge(S.unread);S.contacts=st.contacts||{};

async function refresh(){
  if(busy||!S.code||S.phase!=="app")return;busy=true;
  let changed=true;
  try{await flush();const t0=Date.now(),st=await api("api_state",S.code);const sig=sigOf(st);changed=sig!==lastSig||Q.get().length>0||S.offline;lastSig=sig;applyState(st,t0)}

  finally{busy=false}
  if(changed)render();
}
function logout(msg){S.docs=null;S.docsTried=0;S.docsUnread=0;S.pay=null;S.admin=null;S.code="";S.me=null;S.pin="";S.pinErr=msg||"";S.sheet=null;S.week=null;S.tab=null;S.marks=[];S.staff=[];ls.set("vk-code",null);ls.set("vk-me",null);ls.set("vk-tab",null);S.phase="code";render()}
async function tryLogin(){
  if(S.busyPin)return;if(!/^(\d{6}|\d{8})$/.test(S.pin)){S.pinErr="Կոդը 6 կամ 8 թիվ է";pinUpdate();return}
  S.busyPin=true;S.pinErr="";render();
  try{const code=S.pin,t0=Date.now(),st=await api("api_state",code);
    S.code=code;applyState(st,t0);
    ls.set("vk-code",S.code);ls.set("vk-me",S.me);S.phase="app";S.busyPin=false;S.pin="";S.tab=null;render()}
  catch(e){S.busyPin=false;S.pin="";S.pinErr=/locked/.test(e.message)?"Շատ սխալ փորձեր։ Սպասեք 10 րոպե։":/bad_pin/.test(e.message)?"Կոդը սխալ է։ Ստուգեք Իլոնայի մոտ։":"Կապ չկա։ Փորձեք նորից։";render();
    requestAnimationFrame(()=>{const d=document.getElementById("dots");if(d){d.classList.remove("shake");void d.offsetWidth;d.classList.add("shake")}try{navigator.vibrate&&navigator.vibrate([30,40,30])}catch(e){}})}
}

/* ---------- events ---------- */
/* Кнопки, которые ждут ответа сервера: сразу показывают «идёт», повторные нажатия не отправляются */
const SLOW=new Set(["pay-save","pay-promise","pay-del","doc-read","push-test","week","save-settings","add-kid","kid-save","st-code","st-off","st-on","st-add","leave","back","delmark","noschool","noschool-off","absent","absent-off","assign","comeback"]);
const inFlight=new Set();
document.addEventListener("click",async e=>{
  const b=e.target.closest("[data-act]");if(!b)return;const a=b.dataset.act;
  if(SLOW.has(a)){const key=a+"|"+(b.dataset.id||b.dataset.kid||"");if(inFlight.has(key))return;inFlight.add(key);
    b.classList.add("busy");b.setAttribute("aria-busy","true");
    try{await act(e,b,a)}finally{inFlight.delete(key);b.classList.remove("busy");b.removeAttribute("aria-busy")}return}
  return act(e,b,a)});
async function act(e,b,a){
  if(a==="open"){S.sheet={type:"kid",kid:b.dataset.kid};render()}
  else if(a==="myroute"){S.sheet={type:"myroute"};render()}
  else if(a==="inbox"){S.inbox=null;S.sheet={type:"inbox"};render();
    try{S.inbox=await api("api_inbox",S.code);render();if(S.unread){await api("api_inboxRead",S.code);S.unread=0;setBadge(0);lastSig="";render()}}catch(err){S.inbox=[];render();toast("Չհաջողվեց բեռնել")}}
  else if(a==="close"){S.sheet=null;render()}
  else if(a==="mark")mark(b.dataset.kind,b.dataset.kid,b.dataset.subject);
  else if(a==="delmark"){if(!confirm("Ջնջե՞լ այս նշումը։"))return;const id=b.dataset.id;S.marks=S.marks.filter(m=>m.id!==id);render();try{await api("api_undo",S.code,id);toast("Նշումը ջնջված է")}catch(err){toast("Չհաջողվեց ջնջել");}refresh()}
  else if(a==="noschool"){if(!confirm("Այսօր դպրոցներում դաս չկա՞։ Ճանապարհի ծանուցումները կանջատվեն այսօրվա համար։"))return;await mark("noschool","*");refresh()}
  else if(a==="leave"){const k=kidById(b.dataset.kid);if(!k||!confirm(k.name+" այլևս չի՞ հաճախում։ Նա կհեռանա ցուցակներից, պատմությունը կմնա։"))return;S.sheet=null;try{await api("api_setActive",S.code,k.id,false);toast(k.name+" — հեռացված է ցուցակից")}catch(err){toast("Չհաջողվեց")}refresh()}
  else if(a==="st-code"){const x=(S.admin||[]).find(y=>y.id===b.dataset.id);if(!x||!confirm(x.name+"-ի համար նոր կոդ ստեղծե՞լ։ Հին կոդն անմիջապես կդադարի աշխատել։"))return;
    try{const c=await api("api_staffNewCode",S.code,x.id);x.code=c;render();toast(x.name+"՝ նոր կոդ "+c)}catch(err){toast("Չհաջողվեց")}}
  else if(a==="st-off"){const x=(S.admin||[]).find(y=>y.id===b.dataset.id);if(!x||!confirm(x.name+"-ին անջատե՞լ։ Նա այլևս չի կարողանա մտնել։"))return;
    try{await api("api_staffSetActive",S.code,x.id,false);S.admin=null;toast(x.name+" անջատված է");refresh();render()}catch(err){toast("Չհաջողվեց")}}
  else if(a==="st-on"){const x=(S.admin||[]).find(y=>y.id===b.dataset.id);if(!x)return;
    try{await api("api_staffSetActive",S.code,x.id,true);S.admin=null;toast(x.name+" միացված է։ Տվեք նրան նոր կոդը։");refresh();render()}catch(err){toast("Չհաջողվեց")}}
  else if(a==="st-add"){const n=document.getElementById("st-name"),r=document.getElementById("st-role"),sb=document.getElementById("st-sub"),er=document.getElementById("st-err");
    const name=n.value.trim();if(name.length<2){er.textContent="Գրեք անունը";n.focus();return}
    document.activeElement&&document.activeElement.blur();
    try{const c=await api("api_staffAdd",S.code,name,r.value,sb.value);S.admin=null;toast(name+" ավելացված է։ Կոդ՝ "+c);refresh();render()}catch(err){toast("Չհաջողվեց")}}
  else if(a==="comeback"){try{await api("api_setActive",S.code,b.dataset.kid,true);toast("Վերադարձված է")}catch(err){toast("Չհաջողվեց")}refresh()}
  else if(a==="tab"){S.tab=b.dataset.v;S.q="";S.sheet=null;ls.set("vk-tab",S.tab);render();window.scrollTo(0,0)}
  else if(a==="filter"){const tile=b.classList.contains("nbox");S.filter=(S.filter===b.dataset.v&&tile)?"all":b.dataset.v;render();
    if(tile){const l=document.getElementById("kidlist");if(l&&window.innerWidth<960)l.scrollIntoView({behavior:"smooth",block:"start"})}}
  else if(a==="login")tryLogin();
  else if(a==="pin-key"){if(S.pin.length<8){S.pin+=b.dataset.v;S.pinErr="";pinUpdate()}}
  else if(a==="pin-del"){S.pin=S.pin.slice(0,-1);S.pinErr="";pinUpdate()}
  else if(a==="logout")logout();
  else if(a==="reload")location.reload();
  else if(a==="push-on")enablePush();
  else if(a==="handover"){S.sheet={type:"handover",kid:b.dataset.kid,kind:b.dataset.kind,other:false};render()}
  else if(a==="ho-pick"){const h=S.sheet;S.sheet=null;mark(h.kind,h.kid,"",b.dataset.who,false)}
  else if(a==="ho-other"){S.sheet.other=true;render();setTimeout(()=>document.getElementById("ho-name")?.focus(),50)}
  else if(a==="ho-other-ok"){const n=(document.getElementById("ho-name")||{}).value||"";if(n.trim().length<2){toast("Գրեք անունը և ով է երեխային");return}
    const h=S.sheet;document.activeElement&&document.activeElement.blur();S.sheet=null;mark(h.kind,h.kid,"",n.trim(),true)}
  else if(a==="kid-new"){S.edit={id:"",name:"",grade:"",school:"",shift:"2",pick:"",drop:"",tariff:"",extra:"",contacts:[{name:"",rel:"մայր",phone:""}],end:[],to:[]};S.sheet={type:"kidEdit"};render()}
  else if(a==="kid-edit"){S.edit=null;S.sheet={type:"kidEdit",kid:b.dataset.kid};render();
    try{const k=await api("api_kidGet",S.code,b.dataset.kid);S.edit={...k,shift:String(k.shift||"2")==="1"?"1":"2",contacts:k.contacts.length?k.contacts.map(c=>({name:c.name,rel:c.rel,phone:c.phone})):[{name:"",rel:"մայր",phone:""}]};render()}catch(err){toast("Չհաջողվեց բեռնել քարտը");S.sheet=null;render()}}
  else if(a==="c-add"){S.edit.contacts.push({name:"",rel:"",phone:""});render()}
  else if(a==="c-del"){S.edit.contacts.splice(Number(b.dataset.i),1);render()}
  else if(a==="kid-save"){const e=S.edit;if(!e||String(e.name||"").trim().length<2){const er=document.getElementById("ke-err");if(er)er.textContent="Գրեք երեխայի անունը";return}
    b.disabled=true;b.textContent="Պահպանում եմ…";
    try{await api("api_kidSave",S.code,e);toast("Քարտը պահպանված է");S.sheet=null;S.edit=null;S.pay=null;lastSig="";render();refresh()}catch(err){b.disabled=false;b.textContent="Պահպանել";toast("Չպահպանվեց")}}
  else if(a==="pm"){const [y,m]=S.payMonth.split("-").map(Number);const d=new Date(y,m-1+Number(b.dataset.d),1);S.payMonth=d.getFullYear()+"-"+pad(d.getMonth()+1);S.pay=null;render()}
  else if(a==="pay-open"){S.sheet={type:"pay",kid:b.dataset.kid};render()}
  else if(a==="pay-save"){const amt=Number(String((document.getElementById("pay-amt")||{}).value||"").replace(/\D/g,""));if(!amt){toast("Գրեք գումարը");return}
    const m=(document.getElementById("pay-m")||{}).value||"cash";document.activeElement&&document.activeElement.blur();
    try{await api("api_pay",S.code,S.sheet.kid,S.payMonth,amt,m,"");S.pay=await api("api_payments",S.code,S.payMonth);toast("Վճարը գրանցված է՝ "+money(amt)+" դր");render()}catch(err){toast("Չգրանցվեց")}}
  else if(a==="pay-promise"){const v=(document.getElementById("pay-prom")||{}).value;if(!v){toast("Ընտրեք ամսաթիվը");return}const [y,mm,dd]=v.split("-");
    document.activeElement&&document.activeElement.blur();
    try{await api("api_pay",S.code,S.sheet.kid,S.payMonth,0,"promise",dd+"."+mm);S.pay=await api("api_payments",S.code,S.payMonth);toast("Նշված է");render()}catch(err){toast("Չգրանցվեց")}}
  else if(a==="pay-del"){if(!confirm("Ջնջե՞լ այս վճարը։"))return;try{await api("api_payDelete",S.code,b.dataset.id);S.pay=await api("api_payments",S.code,S.payMonth);render()}catch(err){toast("Չհաջողվեց")}}
  else if(a==="docs"){S.sheet={type:"docs"};render();if(isOwner())api("api_docReads",S.code).then(r=>{S.docReads=r;render()}).catch(()=>{});try{S.docs=await api("api_docs",S.code);S.docsUnread=docsUnreadN();render();docPrefetch()}catch(err){if(!S.docs)S.docs=[];render();if(!S.docs.length)toast("Չհաջողվեց բեռնել")}}
  else if(a==="doc-open"){const id=b.dataset.id,meta=(S.docs||[]).find(x=>x.id===id)||{},c=DOCC[id];
    S.doc=c?{id,title:meta.title,version:c.v,html:c.html}:null;S.sheet={type:"doc",kid:id};render();
    if(c&&c.v===meta.version)return;
    try{const d=await api("api_doc",S.code,id);DOCC[id]={v:d.version,html:d.html};docCacheSave();if(S.sheet&&S.sheet.kid===id){S.doc=d;render()}}catch(err){if(!c){toast("Չհաջողվեց բեռնել");S.sheet={type:"docs"};render()}}}
  else if(a==="doc-read"){const id=b.dataset.id,d=(S.docs||[]).find(x=>x.id===id);if(!d||d.readAt)return;
    d.readAt=Date.now();S.docsUnread=docsUnreadN();render();toast("Նշված է՝ կարդացել եք");
    try{d.readAt=await api("api_docRead",S.code,id)}catch(err){d.readAt=0;S.docsUnread=docsUnreadN();render();toast("Չհաջողվեց նշել։ Փորձեք նորից։")}}
  else if(a==="push-test"){if(!("Notification" in window)||Notification.permission!=="granted"){enablePush();return}
    try{await subscribePush(false);const n=await api("api_pushTest",S.code);toast(n?"Ուղարկված է։ Ծանուցումը կգա մի քանի վայրկյանից։":"Այս հեռախոսը դեռ միացված չէ ծանուցումներին")}catch(e){toast("Չհաջողվեց ուղարկել")}}
  else if(a==="hint-x"){ls.set("vk-hint","1");render()}
  else if(a==="install"&&S.installEvt){S.installEvt.prompt();S.installEvt=null;ls.set("vk-hint","1");render()}
  else if(a==="week"){b.textContent="Հավաքում եմ…";try{S.week=await api("api_week",S.code);render()}catch(err){toast("Չհաջողվեց");b.textContent="Հավաքել 7 օրվա տվյալները"}}
  else if(a==="save-settings"){const v=id=>Math.max(1,Math.round(Number(document.getElementById(id).value)||0));const st={playMax:v("set-playMax"),mealAfter:v("set-mealAfter"),teacherMax:v("set-teacherMax"),sessionMax:v("set-sessionMax")};
    document.activeElement&&document.activeElement.blur();try{await api("api_settings",S.code,st);S.settings=st;toast("Պահպանված է");render()}catch(err){toast("Չպահպանվեց")}}
  else if(a==="add-kid"){const n=document.getElementById("new-name"),g=document.getElementById("new-grade"),er=document.getElementById("new-err");const name=n.value.trim();
    if(name.length<2){er.textContent="Գրեք երեխայի անունը";n.focus();return}n.blur();try{await api("api_addKid",S.code,name,g.value);toast(name+" — ավելացված է");refresh()}catch(err){toast("Չպահպանվեց")}}
}
document.addEventListener("input",e=>{
  const t=e.target;if(S.edit&&t.dataset){if(t.dataset.f){S.edit[t.dataset.f]=t.value}else if(t.dataset.c!==undefined&&t.dataset.k){S.edit.contacts[Number(t.dataset.c)][t.dataset.k]=t.value}else if(t.dataset.t){(S.edit[t.dataset.t]=S.edit[t.dataset.t]||[])[Number(t.dataset.i)]=t.value}}
  if(e.target.id==="q"){S.q=e.target.value;render()}
  else if(e.target.id==="new-name"){const er=document.getElementById("new-err");if(er)er.textContent=""}
});
/* свайп вниз закрывает лист (на телефоне) */
(()=>{let y0=0,dy=0,t0=0,sh=null,on=false,vy=0,ly=0,lt=0;const box=document.getElementById("sheetbox");
  const mobile=()=>!matchMedia("(min-width:960px)").matches;
  box.addEventListener("touchstart",e=>{if(!mobile())return;const s=e.target.closest(".sheet");if(!s||e.touches.length>1)return;
    if(e.target.closest("input,select,textarea,.tbl"))return;
    if(!e.target.closest(".grab")&&s.scrollTop>0)return;sh=s;y0=ly=e.touches[0].clientY;dy=0;t0=lt=Date.now();vy=0;on=false},{passive:true});
  box.addEventListener("touchmove",e=>{if(!sh)return;const d=e.touches[0].clientY-y0;
    if(!on){if(d<6){if(d<-6)sh=null;return}if(sh.scrollTop>0){sh=null;return}on=true;sh.classList.add("drag")}
    const tn=Date.now(),yn=e.touches[0].clientY;if(tn>lt)vy=0.6*vy+0.4*((yn-ly)/(tn-lt));ly=yn;lt=tn;
    dy=Math.max(0,d);sh.style.transform=`translateY(${dy}px)`;const sc=box.querySelector(".scrim");if(sc)sc.style.opacity=String(Math.max(0,1-dy/400));if(e.cancelable)e.preventDefault()},{passive:false});
  const end=()=>{if(!sh)return;const s=sh;sh=null;if(!on)return;on=false;s.classList.remove("drag");const sc=box.querySelector(".scrim");
    const fast=dy>24&&vy>0.35;
    if(dy>110||fast){s.style.transition="transform .2s var(--ease-out)";s.style.transform="translateY(100%)";if(sc)sc.style.opacity="0";setTimeout(()=>{s.style.transition="";s.style.transform="";if(sc)sc.style.opacity="";S.sheet=null;render()},210)}
    else{s.style.transform="";if(sc)sc.style.opacity=""}};
  box.addEventListener("touchend",end);box.addEventListener("touchcancel",end)})();
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&S.sheet){S.sheet=null;render()}if(S.phase==="code"){if(/^[0-9]$/.test(e.key)&&S.pin.length<8){S.pin+=e.key;S.pinErr="";pinUpdate()}else if(e.key==="Backspace"){S.pin=S.pin.slice(0,-1);pinUpdate()}else if(e.key==="Enter")tryLogin()}});
document.addEventListener("change",async e=>{const x=e.target;if(S.edit&&x.dataset&&x.dataset.f){S.edit[x.dataset.f]=x.value;if(x.dataset.f==="shift"){x.blur();render()}return}if(x.dataset&&x.dataset.t&&S.edit){(S.edit[x.dataset.t]=S.edit[x.dataset.t]||[])[Number(x.dataset.i)]=x.value;return}if(!x.dataset||!x.dataset.assign)return;
  const r=(S.routes||[]).find(y=>y.kid===x.dataset.kid&&y.kind===x.dataset.kind),old=r?r.staff:"";if(r)r.staff=x.value;x.blur();render();
  try{await api("api_assign",S.code,S.day||dayKey(NOW()),x.dataset.kid,x.dataset.kind,x.value);toast("Նշանակված է՝ "+sname(x.value))}catch(err){if(r)r.staff=old;render();toast("Չպահպանվեց")}});
window.addEventListener("scroll",()=>document.getElementById("top").classList.toggle("sh",window.scrollY>4),{passive:true});
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();S.installEvt=e;render()});

/* ---------- boot ---------- */
(function boot(){
  if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
  S.code=ls.get("vk-code")||"";S.me=ls.get("vk-me");S.tab=ls.get("vk-tab");
  if(S.code&&S.me){S.phase="app";S.phase="app";render();refresh()}else{S.phase="code";render()}
  setInterval(()=>{if(!document.hidden)refresh()},30000);
  setInterval(()=>{if(!document.hidden&&S.phase==="app")render()},60000);
  window.addEventListener("online",()=>refresh());
  document.addEventListener("visibilitychange",()=>{if(!document.hidden)refresh()});
})();
</script>
